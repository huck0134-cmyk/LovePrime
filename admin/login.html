<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LovePrime Admin Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #100814, #30132d);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: #211329;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 0 30px rgba(255, 38, 120, 0.2);
}

.logo {
    text-align: center;
    font-size: 35px;
    font-weight: bold;
    color: #ff4d8d;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #ccc;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #45314d;
    border-radius: 8px;
    background: #100814;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #ff2678;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#message {
    text-align: center;
    margin-top: 15px;
    overflow-wrap: anywhere;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: white;
    text-decoration: none;
}

.back:hover {
    color: #ff4d8d;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">LovePrime ❤️</div>

    <p class="subtitle">Authorized Admin Login</p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            autocomplete="username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Admin Password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginBtn">
            Login to Admin
        </button>

    </form>

    <p id="message"></p>

    <a href="index.html" class="back">
        ← Back to LovePrime Website
    </a>

</div>

<script type="module">

import {
    auth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "./firebase.js";

const ADMIN_EMAIL = "huck0134@gmail.com";

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (email !== ADMIN_EMAIL) {
        message.textContent = "Access Denied: Admin email only!";
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Please wait...";
    message.textContent = "Checking login...";

    try {

        const result = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        if (result.user.email?.toLowerCase() !== ADMIN_EMAIL) {
            await signOut(auth);
            message.textContent = "Unauthorized account!";
            return;
        }

        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

    } catch (error) {

        if (error.code === "auth/invalid-credential") {
            message.textContent = "Email ya password galat hai!";
        } else if (error.code === "auth/too-many-requests") {
            message.textContent = "Too many attempts. Thodi der baad try karo.";
        } else {
            message.textContent = "Login error: " + error.message;
        }

    } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "Login to Admin";

    }

});

onAuthStateChanged(auth, async function(user) {

    if (user) {

        if (user.email?.toLowerCase() === ADMIN_EMAIL) {
            window.location.href = "dashboard.html";
        } else {
            await signOut(auth);
        }

    }

});

</script>

</body>
</html>
